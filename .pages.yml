# Interface d'édition du site (Pages CMS : https://app.pagescms.org)
# Chaque rubrique modifie un fichier du dossier contenu/. À chaque enregistrement,
# le site, la carte PDF, les photos et les aperçus de liens sont regénérés et publiés
# automatiquement (1 à 2 minutes). Rubriques rangées de la plus utilisée à la moins utilisée.
# Un texte vidé par erreur reprend le texte d'origine.

media:
  input: photos
  output: /photos
  extensions: [jpg, jpeg, png, webp, heic, heif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Ajout : {filename} (via Pages CMS)"
      update: "Modification : {name} (via Pages CMS)"
      delete: "Suppression : {filename} (via Pages CMS)"
      rename: "Renommage : {oldFilename} → {newFilename} (via Pages CMS)"

components:
  jour:
    type: string
    description: "Exemple : 18h-22h. Avec une coupure : 11h30-14h, 18h-22h. Après minuit : 18h-1h. Vide = fermé ce jour-là."
    pattern:
      regex: '^$|^\s*\d{1,2}h(\d{2})?\s*[-–]\s*\d{1,2}h(\d{2})?(\s*,\s*\d{1,2}h(\d{2})?\s*[-–]\s*\d{1,2}h(\d{2})?)*\s*$'
      message: "Écrire par exemple 18h-22h (ou 11h30-14h, 18h-22h), ou laisser vide si fermé."
  lien:
    type: string
    description: "Adresse complète de la page, copiée depuis le navigateur (commence par https://). Laisser vide si l'établissement n'y est pas."
    pattern:
      regex: '^$|^https?://\S+$'
      message: "L'adresse doit commencer par https://"

content:
  # ---------- 1. Carte, page 1 : produits principaux ----------
  - name: carte
    label: "Carte (page 1)"
    type: file
    path: contenu/carte.json
    format: json
    fields:
      - name: produits
        label: Produits
        description: "Glisser un produit pour changer son ordre : même ordre sur le site et le PDF."
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{nom}"
        fields:
          - name: nom
            label: Nom
            type: string
            required: true
          - name: description
            label: Description (facultatif)
            description: "Par exemple la composition : « Tomate, mozzarella, basilic ». Un retour à la ligne est gardé."
            type: text
          - name: prix
            label: Prix en euros, un par taille, dans l'ordre des tailles
            description: "Même ordre que la liste « Tailles » plus bas. Pour les centimes, un point : 12.5 s'affiche « 12,50 € »."
            type: number
            list:
              min: 1
              max: 6
              collapsible: false
            options:
              min: 0
          - name: badge
            label: Badge (facultatif)
            description: "Petit mot à côté du nom, par exemple « Nouveau »."
            type: string
          - name: masque
            label: Masquer ce produit
            description: "Coché, le produit n'apparaît plus nulle part, sans être supprimé."
            type: boolean
      - name: mention
        label: Phrase sous la liste (facultatif)
        description: "Petite ligne en bas de la liste, sur le site et le PDF."
        type: text
      - name: tailles
        label: Tailles ou formats
        description: "Les colonnes de prix. Si tu ajoutes, retires ou déplaces une taille, fais pareil avec les prix de chaque produit."
        type: object
        list:
          min: 1
          max: 6
          collapsible: false
        fields:
          - name: nom
            label: Nom (ex. Petite)
            type: string
            required: true
          - name: taille
            label: Précision (ex. 30 cm, facultatif)
            type: string
      - name: enTeteTitre
        label: "Haut de la carte : titre"
        description: "Par exemple « La carte »."
        type: string
      - name: enTeteSousTitre
        label: "Haut de la carte : sous-titre (facultatif)"
        description: "Vide = vos produits et le mode de vente, réglés dans la rubrique « Établissement »."
        type: string
      - name: titreListe
        label: "Titre de la liste (facultatif)"
        description: "Au-dessus de la liste, à gauche des tailles. Vide = « Nos » suivi de vos produits."
        type: string

  # ---------- 2. Carte, page 2 : autres produits ----------
  - name: carte-page2
    label: "Carte (page 2)"
    type: file
    path: contenu/carte-page2.json
    format: json
    fields:
      - name: rubriques
        label: Rubriques
        description: "Par exemple « Boissons », « Desserts », « Salades ». Glisser pour changer l'ordre. S'il n'y a aucun article, la page 2 disparaît."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titre}"
        fields:
          - name: titre
            label: Nom de la rubrique
            type: string
            required: true
          - name: articles
            label: Articles
            description: "Glisser un article pour changer son ordre."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nom}"
            fields:
              - name: nom
                label: Nom
                type: string
                required: true
              - name: detail
                label: Précision (facultatif)
                description: "Par exemple « Bouteille 1,5 l » ou « Fait maison »."
                type: string
              - name: prix
                label: Prix en euros
                description: "Pour les centimes, un point : 4.5 s'affiche « 4,50 € »."
                type: number
                options:
                  min: 0
              - name: badge
                label: Badge (facultatif)
                description: "Petit mot à côté du nom, par exemple « Nouveau »."
                type: string
              - name: masque
                label: Masquer cet article
                description: "Coché, l'article n'apparaît plus, sans être supprimé."
                type: boolean
      - name: titre
        label: "Haut de la page 2 : titre"
        description: "Par exemple « Boissons & desserts ». Sert aussi au renvoi « … en page 2 » de la première page."
        type: string
      - name: sousTitre
        label: "Haut de la page 2 : sous-titre (facultatif)"
        description: "Vide = le nom des rubriques suivi du mode de vente."
        type: string
      - name: mention
        label: Phrase en bas de la page 2 (facultatif)
        type: text

  # ---------- 3. Horaires et fermetures ----------
  - name: horaires
    label: Horaires et fermetures
    type: file
    path: contenu/horaires.json
    format: json
    fields:
      - name: horaires
        label: Horaires d'ouverture
        description: "Mis à jour partout : site, badge « Ouvert / Fermé », carte PDF, Google. Pense à mettre les mêmes sur la fiche Google."
        type: object
        fields:
          - { name: lundi, label: Lundi, component: jour }
          - { name: mardi, label: Mardi, component: jour }
          - { name: mercredi, label: Mercredi, component: jour }
          - { name: jeudi, label: Jeudi, component: jour }
          - { name: vendredi, label: Vendredi, component: jour }
          - { name: samedi, label: Samedi, component: jour }
          - { name: dimanche, label: Dimanche, component: jour }
      - name: fermetureDu
        label: "Fermeture exceptionnelle (vacances, jour férié…) : du"
        description: "Pendant ces dates, le site affiche « Fermé » et un bandeau prévient les clients (dès 3 semaines avant). Les dates passées n'ont plus d'effet."
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: fermetureAu
        label: "au (inclus)"
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: annonce
        label: Bandeau d'annonce (facultatif)
        description: "Une phrase courte, tout en haut du site, par exemple « Nouveau à la carte ! ». Vide = pas de bandeau."
        type: string

  # ---------- 4. Photos ----------
  - name: photos
    label: Photos de l'accueil
    type: file
    path: contenu/photos.json
    format: json
    list: true
    fields:
      - name: image
        label: Photo
        description: "JPG, PNG, WebP ou photo d'iPhone, en pleine taille : le site l'allège tout seul. Sujet bien centré, lumière du jour. La 1re photo est la plus grande et sert d'aperçu quand on partage le lien. Glisser pour changer l'ordre. Jusqu'à 16 photos : à partir de 6, elles défilent sur le côté."
        type: image
        required: true
      - name: legende
        label: Légende affichée sur la photo (facultatif)
        description: "Quelques mots, par exemple le nom du produit. Vide = pas de légende."
        type: string
      - name: description
        label: Ce qu'on voit sur la photo (facultatif, non affiché)
        description: "Quelques mots pour Google et les personnes malvoyantes. Si vide, la légende est utilisée."
        type: string

  # ---------- 5. Textes de l'accueil (dans l'ordre de la page) ----------
  - name: textes
    label: Textes de l'accueil
    type: file
    path: contenu/textes.json
    format: json
    fields:
      - name: titre
        label: "Haut de page : grand titre"
        description: "Une phrase courte."
        type: string
      - name: introduction
        label: "Haut de page : phrase d'introduction"
        description: "Sous le grand titre, 2 lignes environ. La zone et les jours d'ouverture sont ajoutés automatiquement."
        type: text
      - name: pointFortTitre
        label: "Bandeau : point fort (titre)"
        description: "Le 3e point du bandeau sous le titre (les 2 premiers, vente et horaires, sont automatiques). Par exemple « Fait maison »."
        type: string
      - name: pointFortTexte
        label: "Bandeau : point fort (texte)"
        description: "Par exemple « Produits frais, préparés sur place »."
        type: string
      - name: histoireTitre
        label: "La maison : titre"
        type: string
      - name: histoire
        label: "La maison : paragraphes"
        description: "Un paragraphe par case. 2 ou 3 paragraphes courts suffisent."
        type: text
        list: true
      - name: histoireSignature
        label: "La maison : signature"
        description: "Sous le texte, par exemple « L'équipe »."
        type: string
      - name: photosTitre
        label: "Photos : titre"
        description: "Au-dessus des photos."
        type: string
      - name: carteTexte
        label: "Bloc « La carte » : phrase"
        description: "Après le nombre de produits et les prix (calculés automatiquement)."
        type: text
      - name: piedDePage
        label: "Pied de page : texte après le nom (facultatif)"
        description: "Vide = le type d'établissement."
        type: string
      - name: introuvableTitre
        label: "Page « adresse introuvable » : titre"
        description: "Affichée si quelqu'un ouvre une mauvaise adresse du site."
        type: string
      - name: introuvableTexte
        label: "Page « adresse introuvable » : texte"
        type: text

  # ---------- 6. Établissement : nom, activité, logo, contact ----------
  - name: contact
    label: "Établissement : nom, logo, contact"
    type: file
    path: contenu/contact.json
    format: json
    fields:
      - name: nom
        label: Nom de l'établissement
        description: "À écrire exactement pareil partout (fiche Google, réseaux, plateformes de livraison…) : Google compare ces informations."
        type: string
        required: true
      - name: logo
        label: Logo (facultatif)
        description: "Image carrée, au moins 720 px de côté : elle est affichée dans un rond (site, carte, icône d'onglet). Vide = logo actuel."
        type: image
      - name: activite
        label: Type d'établissement
        description: "Par exemple « Pizzeria », « Restaurant », « Boulangerie ». Affiché en haut de l'accueil (« … à [ville] ») et pour Google."
        type: string
        required: true
      - name: produitSingulier
        label: "Vos produits, au singulier"
        description: "En minuscules, par exemple « pizza artisanale » ou « burger maison ». Sert aux textes automatiques (« 1 … »)."
        type: string
      - name: produitPluriel
        label: "Vos produits, au pluriel"
        description: "Par exemple « pizzas artisanales » ou « burgers maison » : sert aux textes automatiques (« 13 … »), aux titres pour Google et aux aperçus de liens."
        type: string
      - name: cuisine
        label: Type de cuisine, une par ligne (pour Google, facultatif)
        description: "Par exemple « Italienne », « Pizza »."
        type: string
        list: true
      - name: telephone
        label: Téléphone
        description: "Écrit comme il doit s'afficher, par exemple 04 12 34 56 78. Sert aussi aux boutons « Appeler »."
        type: string
        required: true
      - name: email
        label: E-mail (facultatif)
        description: "Affiché sur le site et la carte PDF, avec un lien pour écrire. Vide = pas d'e-mail affiché."
        type: string
        pattern:
          regex: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
          message: "Adresse e-mail incomplète, par exemple nom@gmail.com"
      - name: adresse
        label: Adresse
        description: "Numéro et rue, par exemple 12 rue de la République."
        type: string
      - name: ville
        label: Code postal et ville
        description: "Par exemple 13001 Marseille."
        type: string
      - name: emporter
        label: Vente à emporter
        description: "Cochée : « À emporter » et « Retrait des commandes sur place » apparaissent sur le site et la carte."
        type: boolean
        default: true
      - name: livraison
        label: Livraison
        description: "Cochée : la livraison et sa zone apparaissent sur le site, la carte et pour Google. Décochée : tout est adapté pour « à emporter » seulement."
        type: boolean
        default: true
      - name: zoneLivraison
        label: Zone de livraison
        description: "Par exemple « la ville et ses alentours »."
        type: string
      - name: communesLivrees
        label: Communes livrées, une par ligne (facultatif)
        description: "Si elles sont renseignées, elles remplacent la zone de livraison sur le site et sont indiquées à Google."
        type: string
        list: true
      - name: reseaux
        label: Réseaux et commande en ligne
        description: "Un lien vide n'apparaît pas sur le site."
        type: object
        fields:
          - { name: uberEats, label: Uber Eats, component: lien }
          - { name: facebook, label: Facebook, component: lien }
          - { name: instagram, label: Instagram, component: lien }
      - name: googlePlaceId
        label: Identifiant de la fiche Google
        type: string
        hidden: true
