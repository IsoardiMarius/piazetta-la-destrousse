# Interface d'édition du site (Pages CMS : https://app.pagescms.org)
# Chaque rubrique modifie un fichier du dossier contenu/. À chaque enregistrement,
# le site, la carte PDF, les photos et les aperçus de liens sont regénérés et publiés
# automatiquement (1 à 2 minutes).

media:
  input: photos
  output: /photos
  extensions: [jpg, jpeg, png, webp, heic, heif]
  rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Ajout : {filename} (via Pages CMS)"
      update: "Modification : {name} (via Pages CMS)"
      delete: "Suppression : {filename} (via Pages CMS)"
      rename: "Renommage : {oldFilename} → {newFilename} (via Pages CMS)"

components:
  jour:
    type: string
    description: "Exemple : 18h-22h. Avec une coupure : 11h30-14h, 18h-22h. Après minuit : 18h-1h. Vide = fermé ce jour-là."
    pattern:
      regex: '^$|^\s*\d{1,2}h(\d{2})?\s*[-–]\s*\d{1,2}h(\d{2})?(\s*,\s*\d{1,2}h(\d{2})?\s*[-–]\s*\d{1,2}h(\d{2})?)*\s*$'
      message: "Écrire par exemple 18h-22h (ou 11h30-14h, 18h-22h), ou laisser vide si fermé."
  lien:
    type: string
    description: "Adresse complète de la page, copiée depuis le navigateur (commence par https://). Laisser vide si la pizzeria n'y est pas."
    pattern:
      regex: '^$|^https?://\S+$'
      message: "L'adresse doit commencer par https://"

content:
  - name: carte
    label: "La carte (page 1 : pizzas)"
    type: file
    path: contenu/carte.json
    format: json
    fields:
      - name: pizzas
        label: Pizzas
        description: "Glisser une pizza pour changer son ordre. Elles apparaissent dans cet ordre sur le site et sur le PDF."
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{nom}"
        fields:
          - name: nom
            label: Nom
            type: string
            required: true
          - name: ingredients
            label: Ingrédients
            description: "Séparés par des virgules, par exemple « Tomate, mozzarella, basilic »."
            type: text
          - name: prix
            label: Prix en euros, un par taille, dans l'ordre des tailles
            description: "Même ordre que la liste « Tailles » en bas de la page (aujourd'hui : Petite, Big, Mega). Pour les centimes, utiliser un point : 12.5 s'affiche « 12,50 € »."
            type: number
            list:
              min: 1
              max: 6
              collapsible: false
            options:
              min: 0
          - name: badge
            label: Badge (facultatif)
            description: "Petit mot affiché à côté du nom, par exemple « Nouveau ». Laisser vide sinon."
            type: string
          - name: masquee
            label: Masquer cette pizza
            description: "Cochée, la pizza n'apparaît plus sur le site ni sur le PDF, sans être supprimée."
            type: boolean
      - name: mention
        label: Phrase sous la carte (facultatif)
        description: "Petite ligne en bas de la liste des pizzas, sur le site et le PDF."
        type: text
      - name: tailles
        label: Tailles
        description: "Les colonnes de prix de la carte. Si tu ajoutes, retires ou déplaces une taille, fais pareil avec les prix de chaque pizza."
        type: object
        list:
          min: 1
          max: 6
          collapsible: false
        fields:
          - name: nom
            label: Nom (ex. Petite)
            type: string
            required: true
          - name: taille
            label: Diamètre (ex. 30 cm)
            type: string

  - name: boissons-desserts
    label: "Boissons et desserts (page 2 de la carte)"
    type: file
    path: contenu/boissons-desserts.json
    format: json
    fields:
      - name: titre
        label: Titre de la page 2 de la carte
        description: "Par exemple « Boissons & desserts ». La page 2 (et le renvoi « en page 2 » sur la première page) n'apparaît que s'il y a au moins un article affiché."
        type: string
      - name: rubriques
        label: Rubriques
        description: "Par exemple « Boissons », « Desserts », « Glaces ». Glisser une rubrique pour changer son ordre."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titre}"
        fields:
          - name: titre
            label: Nom de la rubrique
            type: string
            required: true
          - name: articles
            label: Articles
            description: "Glisser un article pour changer son ordre."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{nom}"
            fields:
              - name: nom
                label: Nom
                type: string
                required: true
              - name: detail
                label: Précision (facultatif)
                description: "Par exemple « Canette 33 cl » ou « Fait maison »."
                type: string
              - name: prix
                label: Prix en euros
                description: "Pour les centimes, utiliser un point : 4.5 s'affiche « 4,50 € »."
                type: number
                options:
                  min: 0
              - name: badge
                label: Badge (facultatif)
                description: "Petit mot affiché à côté du nom, par exemple « Nouveau »."
                type: string
              - name: masque
                label: Masquer cet article
                description: "Coché, l'article n'apparaît plus sur la carte ni sur le PDF, sans être supprimé."
                type: boolean
      - name: mention
        label: Phrase en bas de la page 2 (facultatif)
        type: text

  - name: horaires
    label: Horaires et congés
    type: file
    path: contenu/horaires.json
    format: json
    fields:
      - name: horaires
        label: Horaires d'ouverture
        description: "Mis à jour partout : site, badge « Ouvert / Fermé », carte PDF, Google. Pense à mettre les mêmes sur ta fiche Google."
        type: object
        fields:
          - { name: lundi, label: Lundi, component: jour }
          - { name: mardi, label: Mardi, component: jour }
          - { name: mercredi, label: Mercredi, component: jour }
          - { name: jeudi, label: Jeudi, component: jour }
          - { name: vendredi, label: Vendredi, component: jour }
          - { name: samedi, label: Samedi, component: jour }
          - { name: dimanche, label: Dimanche, component: jour }
      - name: fermetureDu
        label: "Fermeture exceptionnelle (vacances, jour férié…) : du"
        description: "Pendant ces dates, le site affiche « Fermé » et un bandeau d'information. Laisser vide s'il n'y a pas de fermeture prévue. Les dates passées n'ont plus d'effet."
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: fermetureAu
        label: "au (inclus)"
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: annonce
        label: Bandeau d'annonce (facultatif)
        description: "Une phrase courte, tout en haut du site, par exemple « Nouveau : la pizza Burrata est arrivée ! ». Vide = pas de bandeau."
        type: string

  - name: photos
    label: Photos
    type: file
    path: contenu/photos.json
    format: json
    list: true
    fields:
      - name: image
        label: Photo
        description: "JPG, PNG, WebP ou photo d'iPhone, en pleine taille : le site l'allège tout seul. Pizza bien centrée, lumière du jour. La 1re photo est la plus grande et sert d'aperçu quand on partage le lien. Glisser pour changer l'ordre ; 4 à 6 photos suffisent."
        type: image
        required: true
      - name: description
        label: Ce qu'on voit sur la photo (facultatif)
        description: "Par exemple « Pizza Atlantique ». Non affiché : aide Google et les personnes malvoyantes."
        type: string

  - name: contact
    label: Contact et réseaux
    type: file
    path: contenu/contact.json
    format: json
    fields:
      - name: nom
        label: Nom de la pizzeria
        description: "À écrire exactement pareil partout (fiche Google, Uber Eats, Facebook…) : Google compare ces informations."
        type: string
        required: true
      - name: telephone
        label: Téléphone
        description: "Écrit comme il doit s'afficher, par exemple 06 40 92 51 76. Sert aussi aux boutons « Appeler »."
        type: string
        required: true
      - name: adresse
        label: Adresse
        description: "Numéro et rue, par exemple 842 avenue de la Doulia."
        type: string
      - name: ville
        label: Code postal et ville
        description: "Par exemple 13112 La Destrousse."
        type: string
      - name: zoneLivraison
        label: Zone de livraison
        description: "Par exemple « La Destrousse et alentours »."
        type: string
      - name: communesLivrees
        label: Communes livrées, une par ligne (facultatif)
        description: "Si elles sont renseignées, elles remplacent la zone de livraison sur le site et sont indiquées à Google."
        type: string
        list: true
      - name: reseaux
        label: Réseaux et commande en ligne
        description: "Un lien vide n'apparaît pas sur le site."
        type: object
        fields:
          - { name: uberEats, label: Uber Eats, component: lien }
          - { name: facebook, label: Facebook, component: lien }
          - { name: instagram, label: Instagram, component: lien }
      - name: googlePlaceId
        label: Identifiant de la fiche Google
        type: string
        hidden: true

  - name: textes
    label: Textes de l'accueil
    type: file
    path: contenu/textes.json
    format: json
    fields:
      - name: titre
        label: Grand titre
        description: "Tout en haut de l'accueil. Une phrase courte. Si un champ de cette page est vide, le texte d'origine reste affiché."
        type: string
      - name: introduction
        label: Phrase d'introduction
        description: "Sous le grand titre, 2 lignes environ."
        type: text
      - name: histoireTitre
        label: "« La maison » : titre"
        type: string
      - name: histoire
        label: "« La maison » : paragraphes"
        description: "Un paragraphe par case. 2 ou 3 paragraphes courts suffisent."
        type: text
        list: true
      - name: histoireSignature
        label: "« La maison » : signature"
        description: "Sous le texte, par exemple « L'équipe de la Piazzetta »."
        type: string
      - name: photosTitre
        label: Titre au-dessus des photos
        description: "Par exemple « Tout juste sorties du four. »"
        type: string
