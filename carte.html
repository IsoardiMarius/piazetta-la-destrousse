<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La carte — Piazzetta La Destrousse</title>
<meta name="description" content="La carte des pizzas artisanales de la Piazzetta La Destrousse : ingrédients et prix par taille.">
<meta name="theme-color" content="#E9E0D2">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/carte.css">
<script>
  /* Modes : ?apercu (vignette du site), ?pdf (génération du PDF), ?imprimer (ouvre l'impression) */
  (function (q) {
    var d = document.documentElement;
    if (/(^|[?&])(apercu|pdf)\b/.test(q)) d.classList.add('is-bare');
    if (/(^|[?&])imprimer\b/.test(q)) d.classList.add('is-print-auto');
  })(location.search);
</script>
<script src="carte.js" defer></script>
<script src="assets/carte-lib.js" defer></script>
<script src="assets/carte-a4.js" defer></script>
</head>
<body>

<nav class="bar" aria-label="Actions">
  <a class="bar__btn bar__back" href="./">
    <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span>Retour au site</span>
  </a>
  <div class="bar__group">
    <button class="bar__btn" type="button" data-print>
      <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      <span>Imprimer</span>
    </button>
    <a class="bar__btn bar__btn--primary" href="carte.pdf" download="Carte-Piazzetta-La-Destrousse.pdf" data-pdf>
      <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>PDF</span>
    </a>
  </div>
</nav>

<div class="stage" data-stage>
  <article class="sheet" data-sheet aria-label="Carte des pizzas">
    <header class="sh-head">
      <img src="assets/logo-360.webp" alt="Piazzetta La Destrousse — Pizzeria artisanale" width="88" height="88">
      <div class="sh-title">
        <h1>La carte</h1>
        <p>Pizzas artisanales · À emporter et en livraison</p>
      </div>
      <div class="sh-order">
        <span>Commandes</span>
        <strong data-bind="telephone">06 40 92 51 76</strong>
      </div>
    </header>

    <main class="sh-main" data-main>
      <div class="sh-list" data-list>
        <div class="row row--head" data-head>
          <span class="row__label">Nos pizzas</span>
        </div>
        <div data-rows></div>
        <p class="sh-mention" data-bind="mention"></p>
      </div>
    </main>

    <footer class="sh-foot">
      <div class="sh-foot__item">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <div><strong data-bind="telephone">06 40 92 51 76</strong><span>Livraison et à emporter</span></div>
      </div>
      <div class="sh-foot__item">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <div><strong data-bind="resumeJours">Mardi – samedi</strong><span data-bind="resumeHeures">De 18h à 22h</span></div>
      </div>
      <div class="sh-foot__item">
        <svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <div><strong data-bind="villeCourte">La Destrousse</strong><span data-bind="adresseCourte">842 av. de la Doulia · et alentours</span></div>
      </div>
    </footer>
  </article>
</div>

</body>
</html>
