name: Publier le site

# Publie automatiquement à chaque modification de la branche par défaut du dépôt
# (depuis Pages CMS ou directement sur GitHub), quel que soit son nom.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    # Version d'Ubuntu fixée : Playwright (génération du PDF) la prend en charge.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Préparer et vérifier le contenu (dossier contenu/)
        run: |
          node scripts/verifier-contenu.mjs
          node scripts/contenu.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le navigateur pour le PDF
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Générer le PDF et la vignette de la carte
        run: node scripts/generer-pdf.mjs

      - name: Rassembler les fichiers du site
        run: |
          mkdir _site
          cp -r index.html carte.html 404.html donnees.js carte.pdf assets _site/

      - name: Préparer les photos (liste contenu/photos.json)
        run: |
          pip install --quiet pillow pillow-heif
          python scripts/preparer-photos.py _site

      - name: Générer les images d'aperçu des liens (SMS, WhatsApp, Facebook…)
        run: node scripts/generer-apercus.mjs _site

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pré-remplir les pages (référencement, aperçus de liens)
        run: node scripts/precalculer.mjs _site "${{ steps.pages.outputs.base_url }}"

      - name: Éviter les anciennes versions en cache
        run: |
          # Nouvelle adresse des fichiers à chaque publication : les visiteurs ne gardent jamais une ancienne version.
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((assets/[^\"?]+|donnees)\.(css|js))\"#\1=\"\2?v=$V\"#g; s#\"carte\.pdf\"#\"carte.pdf?v=$V\"#g; s#\"assets/apercu-carte\.jpg\"#\"assets/apercu-carte.jpg?v=$V\"#g" _site/*.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # En cas d'échec : une alerte (« issue ») est ouverte sur GitHub, ce qui envoie un e-mail
  # au propriétaire du dépôt. Le site en ligne, lui, ne change pas.
  alerte:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ouvrir ou compléter l'alerte
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODIF: ${{ github.event.head_commit.message || 'publication lancée à la main' }}
        run: |
          node scripts/verifier-contenu.mjs > /dev/null 2>&1 || true
          {
            echo "La publication du **$(date -u '+%d/%m/%Y à %H:%M') (UTC)** a échoué. **Le site en ligne n'a pas changé** : il garde la version précédente."
            echo
            echo "Modification en cause : « $(printf '%s' "$MODIF" | head -n 1) »"
            echo
            if [ -f rapport-contenu.md ]; then cat rapport-contenu.md; echo; fi
            echo "Détails de la publication : $LIEN"
            echo
            echo "Cette alerte se ferme toute seule à la prochaine publication réussie."
          } > alerte.md
          TITRE="La publication du site a échoué"
          NUM=$(gh issue list --state open --search "\"$TITRE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body-file alerte.md; else gh issue create --title "$TITRE" --body-file alerte.md; fi

  fin-alerte:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Fermer l'alerte s'il y en avait une
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --state open --search "\"La publication du site a échoué\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Publication réussie : le site est de nouveau à jour."
          done
