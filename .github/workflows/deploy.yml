name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vérifier la carte (carte.js)
        run: node scripts/verifier-carte.mjs

      - name: Installer le navigateur pour le PDF
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Générer le PDF de la carte
        run: node scripts/generer-pdf.mjs

      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp -r index.html carte.html mentions-legales.html carte.js carte.pdf assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
