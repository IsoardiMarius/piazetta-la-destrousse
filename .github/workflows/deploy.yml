name: Publier le site

# Publie automatiquement à chaque push sur la branche par défaut du dépôt
# (celle qu'on modifie depuis GitHub), quel que soit son nom.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    # Version d'Ubuntu fixée : Playwright (génération du PDF) la prend en charge.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vérifier la carte (carte.js)
        run: node scripts/verifier-carte.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer le navigateur pour le PDF
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Générer le PDF et la vignette de la carte
        run: node scripts/generer-pdf.mjs

      - name: Rassembler les fichiers du site
        run: |
          mkdir _site
          cp -r index.html carte.html 404.html carte.js infos.js carte.pdf assets _site/

      - name: Préparer les photos (dossier photos/)
        run: |
          pip install --quiet pillow pillow-heif
          python scripts/preparer-photos.py _site

      - name: Générer les images d'aperçu des liens (SMS, WhatsApp, Facebook…)
        run: node scripts/generer-apercus.mjs _site

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pré-remplir les pages (référencement, aperçus de liens)
        run: node scripts/precalculer.mjs _site "${{ steps.pages.outputs.base_url }}"

      - name: Éviter les anciennes versions en cache
        run: |
          # Nouvelle adresse des fichiers à chaque publication : les visiteurs ne gardent jamais une ancienne version.
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((assets/[^\"?]+|carte|infos)\.(css|js))\"#\1=\"\2?v=$V\"#g; s#\"carte\.pdf\"#\"carte.pdf?v=$V\"#g; s#\"assets/apercu-carte\.jpg\"#\"assets/apercu-carte.jpg?v=$V\"#g" _site/*.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
