name: Publier le site

# Publie automatiquement à chaque push sur la branche par défaut du dépôt
# (celle qu'on modifie depuis GitHub), quel que soit son nom.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    # Version d'Ubuntu fixée : Playwright (génération du PDF) la prend en charge.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Vérifier la carte (carte.js)
        run: node scripts/verifier-carte.mjs

      - name: Installer le navigateur pour le PDF
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Générer le PDF de la carte
        run: node scripts/generer-pdf.mjs

      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp -r index.html carte.html carte.js carte.pdf assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
