<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page introuvable — Piazzetta La Destrousse</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F0E6">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<style>
  .nf{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:48px var(--gutter)}
  .nf img{width:120px;height:120px;border-radius:50%;animation:logo-in 1s var(--ease) both}
  .nf .lead{max-width:28em}
  .nf .actions{justify-content:center}
</style>
</head>
<body>
<main class="nf">
  <img src="assets/logo-360.webp" alt="Piazzetta La Destrousse" width="120" height="120">
  <h1 class="h-section" data-bind="introuvableTitre">Cette page s’est égarée.</h1>
  <p class="lead" data-bind="introuvableTexte">L’adresse demandée n’existe pas ou plus. La carte, elle, est toujours là.</p>
  <div class="actions">
    <a class="btn btn--primary" href="./">Retour à l’accueil</a>
    <a class="btn btn--secondary" href="carte.html">Voir la carte</a>
  </div>
</main>
</body>
</html>
