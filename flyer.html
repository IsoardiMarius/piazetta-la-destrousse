<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyer à imprimer — Piazzetta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E9E0D2">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/flyer.css">
<script>
  /* ?pdf : version pour l'imprimeur (3 mm de fond perdu autour du format), produite à la publication */
  if (/(^|[?&])pdf\b/.test(location.search)) document.documentElement.classList.add('is-pdf');
</script>
<script src="donnees.js" defer></script>
<script src="assets/carte-lib.js" defer></script>
<script src="assets/flyer.js" defer></script>
</head>
<body>

<nav class="bar" aria-label="Actions">
  <a class="bar__btn bar__back" href="./" aria-label="Retour au site">
    <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    <span>Retour au site</span>
  </a>
  <div class="bar__group">
    <button class="bar__btn" type="button" data-print>
      <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      <span>Imprimer</span>
    </button>
    <a class="bar__btn bar__btn--primary" href="flyer.pdf" download="Flyer-Piazzetta-La-Destrousse.pdf" data-pdf>
      <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>PDF<span class="bar__plus"> pour l’imprimeur</span></span>
    </a>
  </div>
</nav>

<main class="scene">
  <div class="cadre">
    <!-- Construit à partir du contenu (pré-rempli à la publication) -->
    <article class="flyer" data-flyer aria-label="Flyer"></article>
  </div>
  <p class="scene__note">Format A5 (14,8 × 21 cm), recto seul. Le PDF comprend 3 mm de fond perdu tout autour, la marge que l’imprimeur coupe : c’est le format demandé par les imprimeurs, en ligne comme en boutique. Le flyer se met à jour tout seul avec le contenu du site.</p>
</main>

</body>
</html>
